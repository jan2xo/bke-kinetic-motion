name: CI

# Manual only. Actions -> CI -> Run workflow (pick the branch).
# Unit tests, plan checks, static gate on every renderer, then a real 3D demo render + full gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + static gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup (Python + cached static ffmpeg)
        uses: ./.github/actions/setup
        timeout-minutes: 6
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Plan check + static gate (every manifest and renderer)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/timeline.py check templates/timeline.json
          python scripts/gate.py static templates/promo_3d_template.py templates/timeline_3d.json --name promo-3d-demo
          for d in projects/*/; do
            n=$(basename "$d")
            python scripts/gate.py static "$d/render.py" "$d/timeline.json" --name "$n"
          done

  render-demo:
    name: Render 3D demo + full gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup (Python + cached static ffmpeg)
        uses: ./.github/actions/setup
        timeout-minutes: 6
      - name: Produce (preview) and gate
        run: python scripts/produce.py 3d-demo --preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-promo-3d-demo-${{ github.run_number }}
          path: out/promo-3d-demo/
          retention-days: 7
