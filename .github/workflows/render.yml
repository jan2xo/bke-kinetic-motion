name: Render

# The production line. Actions -> Render -> Run workflow, type the project folder name.
# Also renders any project whose files changed on main. The MP4 ships only if the gate passes.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder under projects/ (or 3d-demo)'
        required: true
        default: render-dock-15s
      preview:
        description: 'Fast preview (S=1). Untick for the final supersampled render'
        type: boolean
        default: false
      strict:
        description: 'Treat WARN as failure'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'projects/**'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P='["${{ inputs.project }}"]'
          else
            P=$(git diff --name-only HEAD~1 HEAD -- projects/ | cut -d/ -f2 | sort -u | while read n; do [ -f "projects/$n/render.py" ] && echo "$n"; done | jq -R . | jq -sc .)
          fi
          echo "projects=${P:-[]}" >> "$GITHUB_OUTPUT"
          echo "Rendering: $P"

  render:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements.txt
      - name: Produce and gate
        shell: bash
        run: |
          ARGS=""
          [ "${{ inputs.preview }}" = "true" ] && ARGS="$ARGS --preview"
          [ "${{ inputs.strict }}" = "true" ] && ARGS="$ARGS --strict"
          python scripts/produce.py "${{ matrix.project }}" $ARGS --out out/render
      - name: "Upload video (gate passed)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ github.run_number }}
          path: |
            out/render/*.mp4
            out/render/*_contact.png
            out/render/gate_summary.md
            out/render/gate_report.json
            out/render/qa/
            out/render/visual_log.json
            out/render/audio_cues.json
            out/render/lint3d.txt
            out/render/validate.txt
          retention-days: 30
      - name: "Upload QA only (gate failed, no deliverable)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ github.run_number }}-FAILED-qa
          path: |
            out/render/gate_summary.md
            out/render/gate_report.json
            out/render/qa/
            out/render/*_contact.png
            out/render/produce_log.json
          if-no-files-found: ignore
          retention-days: 14
