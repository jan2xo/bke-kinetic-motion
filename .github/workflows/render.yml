name: Render

# The production line. main holds only the template + reference; every video is a PR.
#   pull_request touching projects/<name>/ -> PREVIEW render + full gate (fast feedback on the PR)
#   push to main (= merged PR)            -> FINAL render (S=2) + full gate of every changed project
#   workflow_dispatch                     -> any project, preview or final, on any branch
# The MP4 artifact is uploaded only when the gate passes.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder under projects/ (or 3d-demo)'
        required: true
        default: render-dock-15s
      preview:
        description: 'Fast preview (S=1). Untick for the final supersampled render'
        type: boolean
        default: false
      strict:
        description: 'Treat WARN as failure'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'projects/**'
  push:
    branches: [main]
    paths:
      - 'projects/**'

permissions:
  contents: read

concurrency:
  group: render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) P='["${{ inputs.project }}"]' ;;
            pull_request) RANGE="origin/${{ github.base_ref }}...HEAD" ;;
            push) RANGE="${{ github.event.before }}..${{ github.sha }}" ;;
          esac
          if [ -z "${P:-}" ]; then
            P=$(git diff --name-only $RANGE -- projects/ | cut -d/ -f2 | sort -u | while read n; do [ -f "projects/$n/render.py" ] && echo "$n"; done | jq -R . | jq -sc .)
          fi
          echo "projects=${P:-[]}" >> "$GITHUB_OUTPUT"
          echo "Rendering: $P"

  render:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Setup (Python + cached static ffmpeg)
        uses: ./.github/actions/setup
        timeout-minutes: 6
      - name: Produce and gate
        shell: bash
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.preview }}" = "true" ]; then ARGS="$ARGS --preview"; fi
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="$ARGS --strict"; fi
          echo "Mode: ${ARGS:-final}"
          python scripts/produce.py "${{ matrix.project }}" $ARGS --out out/render
      - name: "Upload video (gate passed)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ github.run_number }}
          path: |
            out/render/*.mp4
            out/render/*_contact.png
            out/render/gate_summary.md
            out/render/gate_report.json
            out/render/qa/
            out/render/visual_log.json
            out/render/audio_cues.json
            out/render/lint3d.txt
            out/render/validate.txt
          retention-days: 30
      - name: "Upload QA only (gate failed, no deliverable)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ github.run_number }}-FAILED-qa
          path: |
            out/render/gate_summary.md
            out/render/gate_report.json
            out/render/qa/
            out/render/*_contact.png
            out/render/produce_log.json
          if-no-files-found: ignore
          retention-days: 14
