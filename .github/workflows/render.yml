name: Render

# Manual only: Actions -> Render -> Run workflow. Pick the branch (your PR branch for a preview, main for the final),
# type the project folder, tick preview for a fast S=1 pass. The MP4 is uploaded only when the gate passes.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder under projects/ (or 3d-demo)'
        required: true
        default: render-dock-15s
      preview:
        description: 'Fast preview (S=1). Untick for the final supersampled render'
        type: boolean
        default: true
      strict:
        description: 'Treat WARN as failure'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}-${{ inputs.project }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Setup (Python + cached static ffmpeg)
        uses: ./.github/actions/setup
        timeout-minutes: 6
      - name: Produce and gate
        shell: bash
        run: |
          ARGS=""
          if [ "${{ inputs.preview }}" = "true" ]; then ARGS="$ARGS --preview"; fi
          if [ "${{ inputs.strict }}" = "true" ]; then ARGS="$ARGS --strict"; fi
          echo "Mode: ${ARGS:-final}"
          python scripts/produce.py "${{ inputs.project }}" $ARGS --out out/render
      - name: "Upload video (gate passed)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-${{ github.run_number }}
          path: |
            out/render/*.mp4
            out/render/*_contact.png
            out/render/gate_summary.md
            out/render/gate_report.json
            out/render/qa/
            out/render/visual_log.json
            out/render/audio_cues.json
            out/render/lint3d.txt
            out/render/validate.txt
          retention-days: 30
      - name: "Upload QA only (gate failed, no deliverable)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-${{ github.run_number }}-FAILED-qa
          path: |
            out/render/gate_summary.md
            out/render/gate_report.json
            out/render/qa/
            out/render/*_contact.png
            out/render/produce_log.json
          if-no-files-found: ignore
          retention-days: 14
