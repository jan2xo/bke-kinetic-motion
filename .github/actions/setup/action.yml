name: BKE setup
description: Python 3.11 + numpy/pillow + a cached static ffmpeg (no apt, so no mirror stalls)
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Python deps
      shell: bash
      run: python -m pip install -q -r requirements.txt
    - name: Cache ffmpeg
      id: ffcache
      uses: actions/cache@v4
      with:
        path: ~/.bke-ffmpeg
        key: ffmpeg-btbn-master-linux64-gpl-v1
    - name: Fetch static ffmpeg
      if: steps.ffcache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.bke-ffmpeg && cd ~/.bke-ffmpeg
        URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        curl -fsSL --retry 3 --max-time 180 "$URL" -o ff.tar.xz
        tar xf ff.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
        rm ff.tar.xz
    - name: Put ffmpeg on PATH
      shell: bash
      run: |
        echo "$HOME/.bke-ffmpeg" >> "$GITHUB_PATH"
        "$HOME/.bke-ffmpeg/ffmpeg" -hide_banner -version | head -1
